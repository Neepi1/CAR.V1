base_frame: base_link
ranger_base_frame: ranger_base_link
base_footprint_frame: base_footprint
lidar_mount_frame: lidar_mount_link
lidar_frame: lidar_link
lidar_level_frame: lidar_level_link
imu_frame: imu_link
gs2_frame: gs2_link
charge_contact_frame: charge_contact_link
lidar_x: 0.3686
lidar_y: 0.0000
lidar_z: 0.85
# JT128 install extrinsic relative to base_link. Keep vehicle mounting here.
lidar_roll: 0.0
lidar_pitch: -0.3490658503988659
lidar_yaw: -3.127692216127
# JT128 raw axis alignment is applied inside the canonical remap nodes before
# publishing /lidar_points and /lidar_imu. Keep lidar_link as the canonical
# sensor frame under the physical mount.
lidar_axis_roll: 0.0
lidar_axis_pitch: 0.0
lidar_axis_yaw: 0.0
imu_x: 0.3686
imu_y: 0.0000
imu_z: 0.85
imu_roll: 0.0
imu_pitch: -0.3490658503988659
imu_yaw: -3.127692216127
# GS2 near-field docking lidar: front centerline, flush with front body plane.
# X follows the current Nav2 footprint front edge and should be refined after a
# direct base_link-to-front-panel measurement.
gs2_x: 0.36
gs2_y: 0.0
gs2_z: 0.290
gs2_roll: 0.0
gs2_pitch: 0.0
gs2_yaw: 0.0
# Charging contacts are on the same centerline as GS2 and 3.8 cm ahead of it.
charge_contact_x: 0.398
charge_contact_y: 0.0
charge_contact_z: 0.255
charge_contact_roll: 0.0
charge_contact_pitch: 0.0
charge_contact_yaw: 0.0
# Gemini 336L depth optical center on the final front-center mount. The camera
# body axes are aligned with base_link; robot_description owns the fixed
# camera336l_link -> camera336l_depth_optical_frame REP-103 rotation.
# X uses 0.369 m from base_link to the chassis front, plus 0.030 m camera depth,
# less the observed 0.005 m protective-cover-to-optical-origin offset.
docking_camera_frame: camera336l_link
docking_camera_depth_optical_frame: camera336l_depth_optical_frame
docking_camera_x: 0.394
docking_camera_y: 0.000
docking_camera_z: 0.350
docking_camera_roll: 0.000
docking_camera_pitch: 0.000
docking_camera_yaw: 0.000
