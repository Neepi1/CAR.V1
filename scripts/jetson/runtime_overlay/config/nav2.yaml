lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    node_names:
      - controller_server
      - velocity_smoother
      - collision_monitor
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower

lifecycle_manager_costmap_filters:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 0.0
    node_names:
      - keepout_filter_mask_server
      - keepout_costmap_filter_info_server

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased", "ElevatorScoped", "ElevatorHallScoped", "ElevatorReverseEntryStagingScoped", "ElevatorReverseDockingScoped", "ElevatorCabinEntryDirect"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.05
      downsample_costmap: false
      allow_unknown: true
    ElevatorScoped:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # Schema-v2 post-call source_landing only. Keep the bounded elevator
      # envelope and commissioned motion order, but ignore costmap obstacles
      # exactly like the later cabin-transit legs.
      unchecked_direct_path: true
      max_distance_m: 2.5
      translation_step_m: 0.025
      rotation_step_rad: 0.05
      # Search parameters remain declared for plugin/profile compatibility,
      # but unchecked_direct_path makes them inactive for this profile.
      search_grid_step_m: 0.05
      search_radius_m: 2.5
      goal_connect_distance_m: 0.10
      maximum_expansions: 60000
      forward_cost: 1.0
      reverse_cost: 1.35
      lateral_cost: 1.15
      mode_switch_cost: 0.20
      soft_cost_weight: 0.35
      clearance_preference_cost_ratio: 1.10
      maximum_search_time_sec: 1.00
    ElevatorHallScoped:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # A clear hall route keeps startup spin -> forward -> final yaw. If that
      # complete swept-footprint candidate is blocked, use the same bounded
      # 16-heading search, including intermediate translations and rotations.
      prefer_clear_startup_spin: true
      max_distance_m: 2.5
      translation_step_m: 0.025
      rotation_step_rad: 0.05
      search_grid_step_m: 0.05
      search_radius_m: 2.5
      goal_connect_distance_m: 0.10
      maximum_expansions: 60000
      forward_cost: 1.0
      reverse_cost: 1.35
      lateral_cost: 1.15
      mode_switch_cost: 0.20
      soft_cost_weight: 0.35
      clearance_preference_cost_ratio: 1.10
      maximum_search_time_sec: 1.00
    ElevatorReverseEntryStagingScoped:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # Source hall-call -> landing only: adopt the commissioned landing yaw,
      # move laterally onto its longitudinal axis, then close the remaining
      # forward/reverse residual. This post-call staging leg ignores costmap
      # obstacles like the later cabin-transit legs; the sequence is retained.
      reverse_entry_staging_sequence: true
      unchecked_direct_path: true
      max_distance_m: 2.5
      translation_step_m: 0.025
      rotation_step_rad: 0.05
      search_grid_step_m: 0.05
      search_radius_m: 2.5
      goal_connect_distance_m: 0.10
      maximum_expansions: 60000
      forward_cost: 1.0
      reverse_cost: 1.35
      lateral_cost: 1.15
      mode_switch_cost: 0.20
      soft_cost_weight: 0.35
      clearance_preference_cost_ratio: 1.10
      maximum_search_time_sec: 1.00
    ElevatorReverseDockingScoped:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # Schema-v3 commissioned maneuver. The planner adopts the stored goal
      # yaw first, then performs longitudinal and lateral stages in that body
      # frame. A hard blockage is reported for wait/retry; it is never replaced
      # with an uncommissioned weaving route inside the doorway or cabin.
      reverse_docking_sequence: true
      max_distance_m: 2.5
      translation_step_m: 0.025
      rotation_step_rad: 0.05
      search_grid_step_m: 0.05
      search_radius_m: 2.5
      goal_connect_distance_m: 0.10
      maximum_expansions: 60000
      forward_cost: 1.0
      reverse_cost: 1.35
      lateral_cost: 1.15
      mode_switch_cost: 0.20
      soft_cost_weight: 0.35
      clearance_preference_cost_ratio: 1.10
      maximum_search_time_sec: 1.00
    ElevatorCabinEntryDirect:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      unchecked_direct_path: true
      max_distance_m: 2.5

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    odom_topic: /local_state/odometry
    speed_limit_topic: /speed_limit
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.01
    # Keep the same FollowPath alive while a pedestrian-sized transient obstacle
    # clears. This remains below the 12 s progress-checker bound, so a genuinely
    # stuck robot still terminates without recovery spins or costmap clearing.
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker", "dock_staging_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathFallback", "ElevatorFollowPath", "ElevatorHallFollowPath", "ElevatorReverseEntryStagingFollowPath", "ElevatorReverseDockingFollowPath", "ElevatorCabinEntryDirectFollowPath", "ElevatorCabinPanelFollowPath"]
    progress_checker:
      # Ordinary navigation retains the proven PoseProgressChecker limits.
      # A fresh typed state from ElevatorScopedController selects the
      # finer/longer limits needed for low-speed terminal corrections and
      # pauses the timer only during explicit WAIT/REPLAN/TF-settle states.
      plugin: "robot_nav_config::ElevatorAwareProgressChecker"
      required_movement_radius: 0.03
      required_movement_angle: 0.05
      movement_time_allowance: 12.0
      elevator_required_movement_radius: 0.015
      elevator_required_movement_angle: 0.015
      elevator_movement_time_allowance: 20.0
      elevator_progress_state_timeout: 0.50
      elevator_progress_state_topic: /ranger_mini3/nav_elevator_scoped_progress_state
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Re-evaluate XY and yaw together on every tick. A latched XY gate can
      # falsely accept a goal after a near-goal obstacle or avoidance maneuver
      # pushes the robot back outside the ordinary point tolerance.
      stateful: false
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.05
    dock_staging_goal_checker:
      plugin: "robot_nav_config::DockStagingGoalChecker"
      # Return-to-dock only. Nav2 owns the coarse route until the robot enters
      # this commissioned approach-frame envelope; robot_docking_manager then
      # owns yaw/lateral/longitudinal near-field motion after actual stop proof.
      forward_capture_min_m: -0.40
      forward_capture_max_m: 0.55
      lateral_capture_max_m: 0.25
      yaw_capture_max_rad: 3.141592653589793
    # Humble 1.1.20 creates RotationShim's private PositionGoalChecker under
    # this leading-dot parameter namespace. Keep XY live while terminal yaw is
    # closing so a transient in-tolerance sample cannot remain latched.
    ".position_checker.stateful": false
    ElevatorFollowPath:
      plugin: "robot_nav_config::ElevatorScopedController"
      # Schema-v2 post-call source_landing only. It retains the commissioned
      # elevator motion order while ignoring local-costmap clearance.
      max_distance_m: 2.5
      goal_xy_tolerance_m: 0.06
      goal_yaw_tolerance_rad: 0.05
      yaw_exit_tolerance_rad: 0.035
      lateral_entry_m: 0.04
      lateral_exit_m: 0.025
      forward_entry_m: 0.04
      forward_exit_m: 0.025
      yaw_kp: 1.20
      yaw_min_speed_radps: 0.08
      yaw_max_speed_radps: 0.50
      lateral_kp: 0.80
      lateral_max_speed_mps: 0.40
      forward_kp: 0.80
      forward_max_speed_mps: 0.40
      reverse_max_speed_mps: 0.40
      settle_linear_speed_mps: 0.01
      settle_angular_speed_radps: 0.02
      settle_duration_sec: 0.30
      total_timeout_sec: 60.0
      # Backward-compatible name: this is now a WAIT_CLEAR notice threshold,
      # not an action-abort deadline.
      blocked_timeout_sec: 3.0
      costmap_lookahead_m: 0.15
      command_clearance_check_enabled: false
      route_revision_enabled: false
      route_revision_interval_sec: 0.5
      route_revision_maximum_expansions: 60000
      route_revision_time_limit_sec: 1.00
      # A material map->odom correction changes the robot's map-relative
      # start pose. Coalesce the correction burst, stop, and rebuild the
      # remaining four-wheel-steer route once from the corrected pose.
      localization_replan_enabled: false
      localization_replan_translation_trigger_m: 0.08
      localization_replan_yaw_trigger_rad: 0.08
      localization_replan_stable_translation_m: 0.015
      localization_replan_stable_yaw_rad: 0.015
      localization_replan_stable_duration_sec: 0.60
      lateral_permit_topic: /ranger_mini3/nav_terminal_lateral_enable
      reverse_permit_topic: /ranger_mini3/nav_terminal_reverse_enable
      progress_state_topic: /ranger_mini3/nav_elevator_scoped_progress_state
    ElevatorHallFollowPath:
      plugin: "robot_nav_config::ElevatorScopedController"
      # Keep the same policy during local replanning if live obstacles differ
      # from the global costmap used by ElevatorHallScoped.
      prefer_clear_startup_spin: true
      max_distance_m: 2.5
      goal_xy_tolerance_m: 0.06
      goal_yaw_tolerance_rad: 0.05
      yaw_exit_tolerance_rad: 0.035
      lateral_entry_m: 0.04
      lateral_exit_m: 0.025
      forward_entry_m: 0.04
      forward_exit_m: 0.025
      yaw_kp: 1.20
      yaw_min_speed_radps: 0.08
      yaw_max_speed_radps: 0.50
      lateral_kp: 0.80
      lateral_max_speed_mps: 0.40
      forward_kp: 0.80
      forward_max_speed_mps: 0.40
      reverse_max_speed_mps: 0.40
      settle_linear_speed_mps: 0.01
      settle_angular_speed_radps: 0.02
      settle_duration_sec: 0.30
      total_timeout_sec: 60.0
      # Backward-compatible name: this is now a WAIT_CLEAR notice threshold,
      # not an action-abort deadline.
      blocked_timeout_sec: 3.0
      costmap_lookahead_m: 0.15
      route_revision_enabled: true
      route_revision_interval_sec: 0.5
      route_revision_maximum_expansions: 60000
      route_revision_time_limit_sec: 1.00
      localization_replan_enabled: true
      localization_replan_translation_trigger_m: 0.08
      localization_replan_yaw_trigger_rad: 0.08
      localization_replan_stable_translation_m: 0.015
      localization_replan_stable_yaw_rad: 0.015
      localization_replan_stable_duration_sec: 0.60
      lateral_permit_topic: /ranger_mini3/nav_terminal_lateral_enable
      reverse_permit_topic: /ranger_mini3/nav_terminal_reverse_enable
      progress_state_topic: /ranger_mini3/nav_elevator_scoped_progress_state
    ElevatorReverseEntryStagingFollowPath:
      plugin: "robot_nav_config::ElevatorScopedController"
      # Post-call source landing/entry staging ignores obstacle clearance but
      # preserves yaw -> lateral -> longitudinal execution.
      reverse_entry_staging_sequence: true
      max_distance_m: 2.5
      goal_xy_tolerance_m: 0.06
      goal_yaw_tolerance_rad: 0.05
      yaw_exit_tolerance_rad: 0.035
      lateral_entry_m: 0.04
      lateral_exit_m: 0.025
      forward_entry_m: 0.04
      forward_exit_m: 0.025
      yaw_kp: 1.20
      yaw_min_speed_radps: 0.08
      yaw_max_speed_radps: 0.50
      lateral_kp: 0.80
      lateral_max_speed_mps: 0.40
      forward_kp: 0.80
      forward_max_speed_mps: 0.40
      reverse_max_speed_mps: 0.40
      settle_linear_speed_mps: 0.01
      settle_angular_speed_radps: 0.02
      settle_duration_sec: 0.30
      total_timeout_sec: 60.0
      blocked_timeout_sec: 3.0
      costmap_lookahead_m: 0.15
      command_clearance_check_enabled: false
      route_revision_enabled: false
      route_revision_interval_sec: 0.5
      route_revision_maximum_expansions: 60000
      route_revision_time_limit_sec: 1.00
      localization_replan_enabled: false
      localization_replan_translation_trigger_m: 0.08
      localization_replan_yaw_trigger_rad: 0.08
      localization_replan_stable_translation_m: 0.015
      localization_replan_stable_yaw_rad: 0.015
      localization_replan_stable_duration_sec: 0.60
      lateral_permit_topic: /ranger_mini3/nav_terminal_lateral_enable
      reverse_permit_topic: /ranger_mini3/nav_terminal_reverse_enable
      progress_state_topic: /ranger_mini3/nav_elevator_scoped_progress_state
    ElevatorReverseDockingFollowPath:
      plugin: "robot_nav_config::ElevatorScopedController"
      reverse_docking_sequence: true
      max_distance_m: 2.5
      goal_xy_tolerance_m: 0.06
      goal_yaw_tolerance_rad: 0.05
      yaw_exit_tolerance_rad: 0.035
      lateral_entry_m: 0.04
      lateral_exit_m: 0.025
      forward_entry_m: 0.04
      forward_exit_m: 0.025
      yaw_kp: 1.20
      yaw_min_speed_radps: 0.08
      yaw_max_speed_radps: 0.50
      lateral_kp: 0.80
      lateral_max_speed_mps: 0.40
      forward_kp: 0.80
      forward_max_speed_mps: 0.40
      reverse_max_speed_mps: 0.40
      settle_linear_speed_mps: 0.01
      settle_angular_speed_radps: 0.02
      settle_duration_sec: 0.30
      total_timeout_sec: 60.0
      blocked_timeout_sec: 3.0
      costmap_lookahead_m: 0.15
      route_revision_enabled: true
      route_revision_interval_sec: 0.5
      route_revision_maximum_expansions: 60000
      route_revision_time_limit_sec: 1.00
      localization_replan_enabled: true
      localization_replan_translation_trigger_m: 0.08
      localization_replan_yaw_trigger_rad: 0.08
      localization_replan_stable_translation_m: 0.015
      localization_replan_stable_yaw_rad: 0.015
      localization_replan_stable_duration_sec: 0.60
      lateral_permit_topic: /ranger_mini3/nav_terminal_lateral_enable
      reverse_permit_topic: /ranger_mini3/nav_terminal_reverse_enable
      progress_state_topic: /ranger_mini3/nav_elevator_scoped_progress_state
    ElevatorCabinEntryDirectFollowPath:
      plugin: "robot_nav_config::ElevatorScopedController"
      max_distance_m: 2.5
      goal_xy_tolerance_m: 0.06
      goal_yaw_tolerance_rad: 0.05
      yaw_max_speed_radps: 0.50
      lateral_max_speed_mps: 0.40
      forward_max_speed_mps: 0.40
      reverse_max_speed_mps: 0.40
      total_timeout_sec: 60.0
      command_clearance_check_enabled: false
      route_revision_enabled: false
      localization_replan_enabled: false
      lateral_permit_topic: /ranger_mini3/nav_terminal_lateral_enable
      reverse_permit_topic: /ranger_mini3/nav_terminal_reverse_enable
      progress_state_topic: /ranger_mini3/nav_elevator_scoped_progress_state
    ElevatorCabinPanelFollowPath:
      plugin: "robot_nav_config::ElevatorScopedController"
      max_distance_m: 2.5
      goal_xy_tolerance_m: 0.06
      goal_yaw_tolerance_rad: 0.05
      yaw_max_speed_radps: 0.50
      lateral_max_speed_mps: 0.20
      forward_max_speed_mps: 0.40
      reverse_max_speed_mps: 0.40
      total_timeout_sec: 60.0
      command_clearance_check_enabled: false
      route_revision_enabled: false
      localization_replan_enabled: false
      lateral_permit_topic: /ranger_mini3/nav_terminal_lateral_enable
      reverse_permit_topic: /ranger_mini3/nav_terminal_reverse_enable
      progress_state_topic: /ranger_mini3/nav_elevator_scoped_progress_state
    FollowPath:
      plugin: "robot_nav_config::GoalScopedRotationShimController"
      primary_controller: "robot_nav_config::RangerMPPIController"
      RangerDynamics:
        enabled: true
        # CAN 2026-06-30: fitted on 011801/013101; held out 011908/013457.
        linear_delay_sec: 0.11
        linear_tau_sec: 0.01823
        acceleration_mps2: 0.61888
        deceleration_mps2: 1.80150
        steering_delay_sec: 0.11
        steering_tau_sec: 0.05402
        wheelbase_m: 0.494
        track_m: 0.364
        # Prediction of the existing downstream smoother, not a second output limiter.
        smoother_max_accel: [0.55, 0.20, 0.90]
        smoother_max_decel: [-0.95, -0.30, -1.10]
      # Humble's stock RotationShim re-arms on every setPlan(). Keep periodic
      # global replanning, but only arm startup heading alignment when the
      # navigation goal itself changes. Terminal goal-yaw rotation is separate
      # and remains enabled below.
      rotate_to_heading_once: true
      goal_change_xy_threshold: 0.01
      goal_change_yaw_threshold: 0.01
      same_goal_rearm_after_idle_sec: 2.0
      # Ackermann MPPI cannot spin in place: its hard turning-radius constraint
      # collapses wz with vx near zero. Let RotationShim own path entry heading
      # before MPPI starts crawling with physically ineffective tiny commands.
      angular_dist_threshold: 0.45
      angular_disengage_threshold: 0.075
      forward_sampling_distance: 0.55
      # Ranger Mini 3 can enter chassis SPINNING mode on aggressive pure-yaw
      # shim commands; keep Nav2-owned heading closure smooth and observable.
      rotate_to_heading_angular_vel: 0.60
      max_angular_accel: 1.2
      # Humble 1.1.19 does not reduce pure-yaw speed as the remaining goal
      # angle shrinks. The project wrapper backports Nav2's stopping envelope
      # so Ranger can enter the yaw tolerance instead of reversing at 0.60rad/s.
      closed_loop: true
      terminal_rotation_braking_enabled: true
      # Keep FollowPath RUNNING when a short Ackermann hairpin cannot close a
      # mostly-lateral residual. The wrapper stops, then executes mutually
      # exclusive yaw, side-slip, and forward/reverse terminal stages.
      terminal_handoff_enabled: true
      terminal_handoff_max_distance_m: 0.40
      terminal_handoff_max_abs_forward_m: 0.15
      terminal_handoff_minimum_abs_lateral_m: 0.06
      terminal_handoff_lateral_dominance_ratio: 1.20
      terminal_handoff_path_length_ratio: 1.80
      terminal_handoff_path_cross_track_m: 0.15
      terminal_handoff_goal_xy_tolerance_m: 0.06
      terminal_handoff_goal_yaw_tolerance_rad: 0.05
      terminal_handoff_yaw_exit_tolerance_rad: 0.035
      terminal_handoff_lateral_entry_m: 0.04
      terminal_handoff_lateral_exit_m: 0.025
      terminal_handoff_forward_entry_m: 0.04
      terminal_handoff_forward_exit_m: 0.025
      terminal_handoff_yaw_kp: 1.20
      terminal_handoff_yaw_min_speed_radps: 0.08
      terminal_handoff_yaw_max_speed_radps: 0.30
      terminal_handoff_lateral_kp: 0.80
      terminal_handoff_lateral_max_speed_mps: 0.05
      terminal_handoff_forward_kp: 0.80
      terminal_handoff_forward_max_speed_mps: 0.10
      terminal_handoff_reverse_max_speed_mps: 0.08
      terminal_handoff_settle_linear_speed_mps: 0.01
      terminal_handoff_settle_angular_speed_radps: 0.02
      terminal_handoff_settle_duration_sec: 0.30
      terminal_handoff_timeout_sec: 20.0
      terminal_handoff_costmap_lookahead_m: 0.15
      terminal_handoff_lateral_permit_topic: /ranger_mini3/nav_terminal_lateral_enable
      terminal_handoff_reverse_permit_topic: /ranger_mini3/nav_terminal_reverse_enable
      # The rolling local costmap is the only navigation map that contains
      # people and other transient obstacles. When they persistently invalidate
      # the active path, repair its prefix with forward-only Hybrid A* and feed
      # the replacement to the same MPPI FollowPath action.
      ordinary_local_repair_enabled: true
      ordinary_local_repair_collision_margin_m: 0.08
      ordinary_local_repair_minimum_goal_distance_m: 0.75
      ordinary_local_repair_inspection_period_sec: 0.20
      ordinary_local_repair_persistence_sec: 0.20
      ordinary_local_repair_retry_period_sec: 0.50
      ordinary_local_repair_minimum_turning_radius_m: 0.81
      ordinary_local_repair_lookahead_distance_m: 4.0
      ordinary_local_repair_rejoin_distance_m: 0.80
      ordinary_local_repair_goal_tolerance_m: 0.05
      ordinary_local_repair_max_planning_time_sec: 0.40
      ordinary_local_repair_lookup_table_size_m: 5.0
      ordinary_local_repair_analytic_expansion_max_length_m: 4.05
      ordinary_local_repair_max_iterations: 60000
      ordinary_local_repair_max_on_approach_iterations: 500
      ordinary_local_repair_angle_quantization_bins: 72
      ordinary_local_repair_progress_topic: /ranger_mini3/nav_elevator_scoped_progress_state
      ordinary_local_repair_path_topic: /ranger_mini3/ordinary_local_repair_path
      simulate_ahead_time: 1.0
      # RotationShim owns ordinary pose_required terminal heading and docking
      # predock staging heading before the Nav2 action succeeds.
      rotate_to_goal_heading: true
      time_steps: 48
      model_dt: 0.0666666667
      batch_size: 1200
      iteration_count: 1
      prune_distance: 4.5
      transform_tolerance: 0.10
      temperature: 0.30
      gamma: 0.03
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.81
      visualize: false
      regenerate_noises: false
      retry_attempt_limit: 3
      reset_period: 1.0
      # Match the Ranger Mini 3's observed smooth chassis response. MPPI may
      # still request 1.2 m/s cruise, but samples and acceleration limits should
      # not assume snap acceleration that the physical base will not track.
      vx_std: 0.30
      vy_std: 0.0
      wz_std: 0.32
      vx_max: 1.20
      # Ordinary MPPI must not optimize reverse trajectories rejected downstream.
      # Near-goal overshoot is owned by the permitted terminal handoff instead.
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.70
      critics:
        - "ConstraintCritic"
        - "ObstaclesCritic"
        - "RangerClearanceCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
        - "VelocityDeadbandCritic"
        - "TwirlingCritic"
      # Native Humble scoring of predicted velocity/curvature constraint violations.
      # Output clipping remains independently enforced by RangerMPPIController.
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 0.45
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.0
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.08
        near_goal_distance: 0.25
        # Match the local inflation layer. The padded rectangular footprint has
        # a 0.634 m circumscribed radius; adding the 0.08 m collision margin and
        # rounding up to the 0.05 m costmap grid requires 0.75 m.
        inflation_radius: 0.75
        cost_scaling_factor: 6.0
        inflation_layer_name: "local_inflation_layer"
      # Separate finite planning preference, NOT footprint_padding or a stop gate.
      # Local repair uses this preference width outside its own hard envelope.
      RangerClearanceCritic:
        enabled: true
        stop_half_x: 0.47
        stop_half_y: 0.36
        preferred_margin: 0.05
        cost_weight: 30.0
        near_goal_distance: 0.75
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.4
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.35
        offset_from_furthest: 12
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Keep the existing forward path-following weight.
        cost_weight: 7.0
        offset_from_furthest: 10
        threshold_to_consider: 0.35
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.35
        max_angle_to_furthest: 1.5
        mode: 0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Retain the existing preference; vx_min enforces forward-only sampling.
        cost_weight: 20.0
        threshold_to_consider: 0.50
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 90.0
        deadband_velocities: [0.025, 0.0, 0.025]
    FollowPathFallback:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.80
      lookahead_dist: 0.75
      min_lookahead_dist: 0.40
      max_lookahead_dist: 1.10
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.00
      transform_tolerance: 0.10
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.80
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "odom"
    robot_base_frame: "base_link"
    transform_tolerance: 0.10
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /local_state/odometry
    bt_loop_duration: 50
    # Nav2 BT action/service acknowledgement can exceed 1s on Jetson while
    # AMCL, costmaps, and Fast DDS discovery are active. Keep HTTP goal submit
    # asynchronous, but give BT-internal servers enough time to acknowledge.
    default_server_timeout: 5000
    wait_for_service_timeout: 8000
    transform_tolerance: 0.10
    default_nav_to_pose_bt_xml: /workspaces/njrh-v3/workspace1/install/robot_nav_config/share/robot_nav_config/behavior_trees/navigate_to_pose.xml
    default_nav_through_poses_bt_xml: /workspaces/njrh-v3/workspace1/install/robot_nav_config/share/robot_nav_config/behavior_trees/navigate_through_poses.xml
    plugin_lib_names:
      - ordinary_navigation_recovery_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_wait_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SimpleSmoother"]
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # MPPI remains Ackermann (vy_max=0). The wider Y/reverse envelope is used
    # only when an authorized elevator controller publishes fresh permits;
    # ordinary controllers retain their own lower command limits.
    max_velocity: [1.20, 0.40, 0.70]
    min_velocity: [-0.40, -0.40, -0.70]
    max_accel: [0.55, 0.20, 0.90]
    max_decel: [-0.95, -0.30, -1.10]
    odom_topic: /local_state/odometry
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      resolution: 0.05
      transform_tolerance: 0.10
      # Confirmed physical body equals StopZone; padding remains separate.
      footprint: "[[0.47, 0.36], [0.47, -0.36], [-0.47, -0.36], [-0.47, 0.36]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "global_inflation_layer"]
      filters: ["keepout_filter"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      global_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 5.0
        inflation_radius: 0.75
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info/keepout
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info/speed
        speed_limit_topic: /speed_limit
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 12.0
      publish_frequency: 8.0
      # Local costmap global_frame must be a continuous local fixed frame such
      # as odom. Do not use base_link here: controller_server reads the robot
      # pose through the costmap, and a base_link global frame keeps that pose
      # nearly constant, causing false SimpleProgressChecker failures.
      # Obstacle sources may still use sensor_frame=base_link below.
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      transform_tolerance: 0.15
      # Also drives footprint clearing and the FootprintApproach consumer.
      footprint: "[[0.47, 0.36], [0.47, -0.36], [-0.47, -0.36], [-0.47, 0.36]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "local_inflation_layer"]
      # Filters run after plugins. Inflate newly marked keepout cells so MPPI's
      # center-cost shortcut still triggers a full-footprint collision check.
      filters: ["keepout_filter", "keepout_inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Use Nav2's native LaserScan observation model for both marking and
        # clearing. LaserScan inf ranges carry explicit free-space rays, unlike
        # the previous custom PointCloud2 clearing cloud.
        combination_method: 0
        footprint_clearing_enabled: true
        min_obstacle_height: -0.20
        max_obstacle_height: 1.40
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_level_link
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          observation_persistence: 0.0
          min_obstacle_height: -0.20
          max_obstacle_height: 1.40
          obstacle_min_range: 0.25
          obstacle_max_range: 5.50
          # Start clearing one 5 cm cell inside the scan marking cutoff. At
          # 0.25 m, integer raytracing left repeatable diagonal blind cells.
          raytrace_min_range: 0.20
          raytrace_max_range: 8.00
      local_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 6.0
        # Cover the padded footprint's 0.634 m circumscribed radius plus the
        # MPPI 0.08 m collision margin, rounded up to the 0.05 m grid.
        inflation_radius: 0.75
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info/keepout
      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.75
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_nav"
    cmd_vel_out_topic: "/cmd_vel_collision_checked"
    transform_tolerance: 0.10
    source_timeout: 1.5
    base_shift_correction: true
    stop_pub_timeout: 0.3
    polygons: ["StopZone", "SlowZone", "FootprintApproach"]
    StopZone:
      type: "polygon"
      # 8 cm visible band outside the unchanged scan mask (0.39 x 0.28 m).
      # This is the confirmed physical body, not padded planning geometry.
      points: [0.47, 0.36, 0.47, -0.36, -0.47, -0.36, -0.47, 0.36]
      action_type: "stop"
      # Two adjacent scan returns stop the robot; one isolated return is treated
      # as noise. The failed 2026-09-07 trace had two returns before MPPI failed.
      max_points: 1
      visualize: false
      polygon_pub_topic: "collision_monitor/stop_zone"
      enabled: true
    SlowZone:
      type: "polygon"
      # The slowdown envelope must contain StopZone on every side.
      points: [0.85, 0.45, 0.85, -0.45, -0.55, -0.45, -0.55, 0.45]
      action_type: "slowdown"
      slowdown_ratio: 0.65
      max_points: 12
      visualize: false
      polygon_pub_topic: "collision_monitor/slow_zone"
      enabled: true
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      max_points: 3
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
