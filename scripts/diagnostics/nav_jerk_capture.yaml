{
  "schema": 1,
  "duration_sec": 300,
  "window_sec": 5,
  "discovery_sec": 6,
  "ready_timeout_sec": 5,
  "continuous_stale_sec": 2,
  "param_timeout_sec": 2,
  "param_total_sec": 18,
  "queue_messages": 4096,
  "queue_bytes": 33554432,
  "disk_budget_mb": 2048,
  "min_free_mb": 256,
  "max_costmap_cells": 100000,
  "log_tail_bytes": 1048576,
  "source_clock_verified": false,
  "storage_id": "sqlite3",
  "thresholds": {"linear_deadzone": 0.01, "angular_deadzone": 0.02, "linear_step": 0.12, "angular_step": 0.25, "gap_sec": 0.35, "short_stop_sec": 2, "position_jump_m": 0.15, "yaw_jump_rad": 0.2, "clock_jump_sec": 0.2, "repeat_window_sec": 5, "repeat_count": 3},
  "roles": {
    "controller_output": {"node": "controller_server", "direction": "pubs", "critical": true},
    "smoother_input": {"node": "velocity_smoother", "direction": "subs", "critical": true},
    "smoother_output": {"node": "velocity_smoother", "direction": "pubs", "critical": true},
    "collision_input": {"node": "collision_monitor", "direction": "subs", "param": "cmd_vel_in_topic", "critical": true},
    "collision_output": {"node": "collision_monitor", "direction": "pubs", "param": "cmd_vel_out_topic", "critical": true},
    "safety_navigation_input": {"node": "robot_safety", "direction": "subs", "param": "cmd_vel_in_topic", "critical": true},
    "safety_final_output": {"node": "robot_safety", "direction": "pubs", "param": "cmd_vel_out_topic", "critical": true},
    "safety_mirror": {"node": "robot_safety", "direction": "pubs", "param": "cmd_vel_mirror_topic"},
    "chassis_input": {"node": "ranger_base_node", "direction": "subs", "critical": true},
    "api_terminal_or_teleop": {"node": "robot_safety", "direction": "subs", "param": "api_cmd_vel_in_topic"},
    "docking_input": {"node": "robot_safety", "direction": "subs", "param": "docking_cmd_vel_in_topic"},
    "scoped_elevator_input": {"node": "robot_safety", "direction": "subs", "param": "elevator_entry_cmd_vel_in_topic"},
    "behavior_output": {"node": "behavior_server", "direction": "pubs"}
  },
  "edges": [["controller_output", "smoother_input"], ["smoother_input", "smoother_output"], ["smoother_output", "collision_input"], ["collision_input", "collision_output"], ["collision_output", "safety_navigation_input"], ["safety_navigation_input", "safety_final_output"], ["safety_final_output", "chassis_input"]],
  "nodes": ["controller_server", "velocity_smoother", "collision_monitor", "robot_safety", "ranger_base_node", "robot_local_state", "local_costmap/local_costmap", "bt_navigator", "robot_localization_bridge", "imu_gyro_bias_filter", "robot_api_server"],
  "related_nodes_regex": "(^|/)(controller_server|planner_server|bt_navigator.*|behavior_server|velocity_smoother|collision_monitor|robot_safety|ranger_base_node|robot_api_server|docking|robot_local_state|wheel_odom_ekf_input|imu_gyro_bias_filter|imu_axis_remap|robot_localization_bridge|amcl|amcl_scan_admission|local_costmap)(/|$)",
  "state_topics": ["/safety/status", "/safety/motion_allowed", "/safety/estop", "/safety/motion_interlock_state", "/safety/dock_interlock_state", "/ranger_base/status", "/docking/status", "/localization/bridge_status", "/amcl_scan_admission/status", "/robot_mode/state", "/ranger_mini3/ordinary_navigation_recovery_status", "/ranger_mini3/nav_elevator_scoped_progress_state"],
  "source_files": ["src/robot_bringup/launch/standard_navigation.launch.py", "scripts/jetson/runtime_overlay/config/nav2.yaml", "scripts/jetson/runtime_overlay/config/robot_safety.yaml", "src/robot_safety/src/robot_safety_node.cpp", "src/ranger_base/src/ranger_messenger.cpp", "src/robot_api_server/src/features/navigation/navigation_module.cpp", "src/robot_api_server/src/features/system_status/system_status_module.cpp", "src/robot_api_server/src/features/docking/lifecycle/docking_http_module.cpp", "src/robot_nav_config/src/goal_scoped_rotation_shim_controller.cpp"],
  "log_globs": ["scripts/jetson/runtime_overlay/web_dashboard/runtime_logs/*nav*.log", "scripts/jetson/runtime_overlay/web_dashboard/runtime_logs/robot_safety*.log", "scripts/jetson/runtime_overlay/web_dashboard/runtime_logs/ranger*.log", "scripts/jetson/runtime_overlay/web_dashboard/runtime_logs/robot_api*.log", "scripts/jetson/runtime_overlay/web_dashboard/runtime_logs/*localization*.log", "scripts/jetson/runtime_overlay/web_dashboard/runtime_logs/*docking*.log"],
  "http_paths": ["/api/v1/navigation/state", "/api/v1/status", "/api/v1/docking/state"],
  "http_enabled": true,
  "http_base": "http://127.0.0.1:8080",
  "http_timeout_sec": 0.7,
  "http_token_env": "ROBOT_API_TOKEN",
  "packages": ["rclpy", "rmw_fastrtps_cpp", "nav2_controller", "nav2_mppi_controller", "nav2_velocity_smoother", "nav2_collision_monitor", "rosbag2_py", "rosbag2_storage_default_plugins"]
}
