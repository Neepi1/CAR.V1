planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased", "ElevatorScoped", "ElevatorHallScoped", "ElevatorReverseEntryStagingScoped", "ElevatorReverseDockingScoped", "ElevatorCabinEntryDirect"]
    GridBased:
      plugin: "robot_nav_config::RangerMini3LatticePlanner"
      tolerance: 0.05
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      lattice_filepath: "__RANGER_LATTICE_FILE__"
      cache_obstacle_heuristic: false
      reverse_penalty: 2.1
      change_penalty: 0.20
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      rotation_penalty: 3.0
      # A clear, goal-aligned corridor is executed as startup spin plus a
      # footprint-checked straight path. Blocked corridors remain stock Lattice
      # plans, so the cheaper start spin does not enable mid-path spin segments.
      direct_corridor_enabled: true
      direct_corridor_minimum_length_m: 1.0
      direct_corridor_goal_yaw_tolerance_rad: 0.20
      direct_corridor_sample_step_m: 0.025
      direct_corridor_max_cost: 0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 4.05
      lookup_table_size: 20.0
      allow_reverse_expansion: true
      smooth_path: true
      smoother:
        tolerance: 1.0e-10
        max_iterations: 1000
        w_data: 0.2
        w_smooth: 0.3
        do_refinement: true
    # The planner profile replaces planner_server.ros__parameters as one
    # launch-parameter dictionary, so repeat the elevator-only plugin here.
    # Ordinary Ranger goals still select GridBased explicitly/default.
    ElevatorScoped:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # Elevator-only 16-heading forward/reverse/lateral/spin search; every
      # sampled edge retains the exact filled-footprint hard-obstacle check.
      max_distance_m: 2.5
      translation_step_m: 0.025
      rotation_step_rad: 0.05
      search_grid_step_m: 0.05
      search_radius_m: 2.5
      goal_connect_distance_m: 0.10
      maximum_expansions: 60000
      forward_cost: 1.0
      reverse_cost: 1.35
      lateral_cost: 1.15
      mode_switch_cost: 0.20
      soft_cost_weight: 0.35
      clearance_preference_cost_ratio: 1.10
      maximum_search_time_sec: 1.00
    ElevatorHallScoped:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # Keep the clear startup-spin candidate, but fall back to the complete
      # 16-heading motion set when that swept-footprint route is blocked.
      prefer_clear_startup_spin: true
      max_distance_m: 2.5
      translation_step_m: 0.025
      rotation_step_rad: 0.05
      search_grid_step_m: 0.05
      search_radius_m: 2.5
      goal_connect_distance_m: 0.10
      maximum_expansions: 60000
      forward_cost: 1.0
      reverse_cost: 1.35
      lateral_cost: 1.15
      mode_switch_cost: 0.20
      soft_cost_weight: 0.35
      clearance_preference_cost_ratio: 1.10
      maximum_search_time_sec: 1.00
    ElevatorReverseEntryStagingScoped:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # Source hall-call -> landing: goal yaw, lateral, longitudinal.
      reverse_entry_staging_sequence: true
      max_distance_m: 2.5
      translation_step_m: 0.025
      rotation_step_rad: 0.05
      search_grid_step_m: 0.05
      search_radius_m: 2.5
      goal_connect_distance_m: 0.10
      maximum_expansions: 60000
      forward_cost: 1.0
      reverse_cost: 1.35
      lateral_cost: 1.15
      mode_switch_cost: 0.20
      soft_cost_weight: 0.35
      clearance_preference_cost_ratio: 1.10
      maximum_search_time_sec: 1.00
    ElevatorReverseDockingScoped:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # Schema-v3 four-point route: goal yaw first, then longitudinal motion,
      # then lateral alignment. Never substitute a weaving detour.
      reverse_docking_sequence: true
      max_distance_m: 2.5
      translation_step_m: 0.025
      rotation_step_rad: 0.05
      search_grid_step_m: 0.05
      search_radius_m: 2.5
      goal_connect_distance_m: 0.10
      maximum_expansions: 60000
      forward_cost: 1.0
      reverse_cost: 1.35
      lateral_cost: 1.15
      mode_switch_cost: 0.20
      soft_cost_weight: 0.35
      clearance_preference_cost_ratio: 1.10
      maximum_search_time_sec: 1.00
    ElevatorCabinEntryDirect:
      plugin: "robot_nav_config::ElevatorScopedPlanner"
      # Only REVERSE_ENTER_CABIN selects this planner. It preserves the Nav2
      # action/result chain while returning the commissioned straight entry
      # segment without rejecting it on the self-obstacle costmap artifact.
      unchecked_direct_path: true
      max_distance_m: 2.5
